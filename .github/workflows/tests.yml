name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérification syntaxique
        run: |
          python -m py_compile nas_video_ai_analyzer.py
          python -m py_compile generate_after_effects_project.py
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Vérification syntaxique du JSX généré
        run: |
          python tests/generate_jsx_fixture.py
          node --check /tmp/msb_generated_check.js
