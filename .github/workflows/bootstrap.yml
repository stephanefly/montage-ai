name: Publish simple Python project

on:
  push:
    paths:
      - simple_bundle.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with simple Python project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/montage-ai-simple
          base64 --decode simple_bundle.b64 > /tmp/montage-ai-simple.zip
          unzip -q /tmp/montage-ai-simple.zip -d /tmp/montage-ai-simple

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/montage-ai-simple/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish simple Python project"
          git push origin HEAD:main
